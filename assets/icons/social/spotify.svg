    <stop offset="0.72" stop-color="#AEB9C3"/>
    <stop offset="1" stop-color="#EEF3F7"/>
  </linearGradient>
  <linearGradient id="silverDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E9EEF2"/>
